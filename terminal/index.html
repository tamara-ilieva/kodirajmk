      <h1>Терминал</h1>

      <div class="terminal-output" id="terminal-output" role="log" aria-label="Терминалски излез" tabindex="0"></div>

      </form>
      <p id="terminal-controls" class="fine-print">↑ ↓ за историја · Tab за дополнување · Escape за излез од полето</p>
